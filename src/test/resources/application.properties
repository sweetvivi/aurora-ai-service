spring.profiles.active=test
# 日志落到 target/ 下，不要写进 ./logs。
#
# logback-spring.xml 里 backend.log / startup.log / sql.log 的目录取自 logging.file.path，
# 而本套件会起几百次 ApplicationContext（387 次启动摘要 vs 15 次真实启动），全部写进 logs/
# 之后 startup.log 里「这次启动用了什么配置」这件事基本没法回溯，backend.log 也被测试噪声撑到十几 MB。
logging.file.path=./target/test-logs
# 每个 ApplicationContext 一个独立的内存库，不要共用 jdbc:h2:mem:backend。
#
# application.yml 里的库名是固定的，且 DB_CLOSE_DELAY=-1 让它活到 JVM 退出；ddl-auto=create-drop
# 又会在**上下文关闭时 DROP 全库的表**。本套件有 40 个 @SpringBootTest 类、20 多处不同的
# properties 组合，产生的上下文数量超过 Spring 的缓存上限（默认 32）。一旦有上下文被淘汰并关闭，
# 它 DROP 掉的是所有上下文共用的那张库，而其余上下文仍被缓存、不会重建 schema，于是后面随机
# 一批用例报 "Table ... not found"（曾出现 53、192 例），重跑顺序一变又全绿。
#
# ${random.uuid} 每个 Environment 求值一次，也就是每个上下文一次，DROP 只可能命中即将关闭的
# 自己那张库，用例结果不再取决于执行顺序与缓存淘汰时机。
spring.datasource.url=jdbc:h2:mem:backend-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
# H2 下只有 schema.sql 建得出 shedlock（它不是实体，Hibernate 不会建）。
# 放在 datasource.url 之后：每个独立库都要各自跑一次初始化。
spring.sql.init.mode=always
# Test-only signing key. Production must provide its own AUTH_JWT_SECRET.
app.auth.jwt-secret=test-only-jwt-signing-key-with-at-least-32-bytes
# Scheduled catalogue refreshes are tested directly; keep Spring test contexts offline.
app.new-api.catalog-sync-enabled=false
app.new-api.catalog-sync-on-startup=false
# The relay address is derived from NEW_API_BASE_URL + /v1, and the offline suite sets neither that
# variable nor LLM_BASE_URL. Pin an absolute placeholder so startup validation accepts the context;
# tests that talk to a stub server override this with their own port.
app.llm.base-url=http://127.0.0.1:18081/v1
# Registration captcha is off for the general suite: reading a random image is not something a
# test can do, and every other test only cares about what happens after that gate. The gate itself
# is covered by CaptchaRegistrationTest, which turns it back on for its own context.
app.captcha.enabled=false
# Registration also creates the New API account in production. The suite has no New API to talk
# to, so the shared context keeps registration local; the remote path is covered by
# NewApiRegistrationTest, which starts its own stub server.
app.auth.new-api-registration-enabled=false
